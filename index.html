<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポモドーロタイマー</title>
  <style>
    :root {
      --color-work: #00BFFF;       /* 25分・スタート：水色 */
      --color-break-short: #1E90FF; /* 5分：青 */
      --color-break-long: #9ACD32;  /* 20分：黄緑 */
      --color-pause: #FF8C00;      /* 一時停止：オレンジ */
      --color-reset: #a1a1aa;
      
      --bg-green: #00FF00;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
      background-color: var(--bg-green);
      color: #1f2937;
    }

    .glass-container {
      background: #ffffff;
      padding: 2.5rem 3rem;
      border-radius: 32px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      border: 2px solid #e5e7eb;
      text-align: center;
      min-width: 320px;
    }

    .time-info {
      font-size: 1rem;
      font-weight: 600;
      color: #4b5563;
      background: #f3f4f6;
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 0.8rem;
    }

    .time-info .arrow {
      color: #9ca3af;
      margin: 0 0.4rem;
    }

    .count {
      font-size: 1rem;
      color: #6b7280;
      margin-bottom: 0.3rem;
      font-weight: 600;
    }

    .status {
      font-size: 1.5rem;
      font-weight: 800;
      color: #374151;
      margin-bottom: 1.8rem;
    }

    .circle-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 2rem auto;
    }

    .circle-svg {
      transform: rotate(-90deg) scaleY(-1);
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .circle-bg {
      fill: none;
      stroke: #e5e7eb;
      stroke-width: 28;
    }

    .ticks line {
      stroke: #ffffff;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .circle-progress {
      fill: none;
      stroke: var(--color-work);
      stroke-width: 28;
      stroke-linecap: butt;
      stroke-dasharray: 691.15;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.5s linear, stroke 0.3s ease;
    }

    .timer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3.6rem;
      font-weight: 800;
      color: #111827;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }

    .btn {
      font-size: 1.05rem;
      padding: 0.8rem 2.2rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 700;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:active {
      transform: translateY(1px);
    }

    #btn-start-pause.start {
      background-color: var(--color-work);
      color: white;
    }

    #btn-start-pause.pause {
      background-color: var(--color-pause);
      color: white;
    }

    .btn-reset {
      background-color: #f3f4f6;
      color: var(--color-reset);
      border: 1px solid #e5e7eb;
    }

    .btn-reset:hover {
      background-color: #e5e7eb;
    }
  </style>
</head>
<body>

<div class="glass-container">
  <div class="time-info" id="time-info">
    <span id="current-time-wrapper">現在 <span id="current-time">00:00</span><span class="arrow">➔</span></span><span id="end-label">終了予定</span> <span id="end-time">00:00</span>
  </div>

  <div class="count" id="count">セット: 1 / 4</div>
  <div class="status" id="status">作業時間 (25分)</div>
  
  <div class="circle-container">
    <svg class="circle-svg" viewBox="0 0 280 280">
      <circle class="circle-bg" cx="140" cy="140" r="110"></circle>
      <circle class="circle-progress" id="progress" cx="140" cy="140" r="110"></circle>
      <g class="ticks" id="ticks-group"></g>
    </svg>
    <div class="timer" id="timer">25:00</div>
  </div>

  <div class="buttons">
    <button class="btn start" id="btn-start-pause" onclick="toggleTimer()">スタート</button>
    <button class="btn btn-reset" onclick="resetTimer()">リセット</button>
  </div>
</div>

<script>
  const WORK_TIME = 25 * 60;       // 作業：25分
  const SHORT_BREAK_TIME = 5 * 60;  // 休憩：5分
  const LONG_BREAK_TIME = 20 * 60; // 長い休憩：20分
  const TOTAL_SETS = 4;

  const COLORS = {
    work: getComputedStyle(document.documentElement).getPropertyValue('--color-work').trim(),
    breakShort: getComputedStyle(document.documentElement).getPropertyValue('--color-break-short').trim(),
    breakLong: getComputedStyle(document.documentElement).getPropertyValue('--color-break-long').trim()
  };

  const RADIUS = 110;
  const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

  let totalTime = WORK_TIME;
  let timeLeft = WORK_TIME;
  let timerId = null;
  let isWorkTime = true;
  let currentSet = 1;

  // バックグラウンド・最小化対策用のタイムスタンプ管理
  let endTimeStamp = null; 

  const timerDisplay = document.getElementById('timer');
  const statusDisplay = document.getElementById('status');
  const countDisplay = document.getElementById('count');
  const progressCircle = document.getElementById('progress');
  const startPauseBtn = document.getElementById('btn-start-pause');
  const currentTimeDisplay = document.getElementById('current-time');
  const currentTimeWrapper = document.getElementById('current-time-wrapper');
  const endLabel = document.getElementById('end-label');
  const endTimeDisplay = document.getElementById('end-time');

  function createFiveSegmentTicks() {
    const ticksGroup = document.getElementById('ticks-group');
    const center = 140;
    const outerRadius = 124;
    const innerRadius = 96;

    for (let i = 0; i < 5; i++) {
      const angleDeg = i * 72;
      const angleRad = (angleDeg * Math.PI) / 180;

      const x1 = center + innerRadius * Math.cos(angleRad);
      const y1 = center + innerRadius * Math.sin(angleRad);
      const x2 = center + outerRadius * Math.cos(angleRad);
      const y2 = center + outerRadius * Math.sin(angleRad);

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      ticksGroup.appendChild(line);
    }
  }

  function playAlarmSound() {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < 3; i++) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime + i * 0.2);
      
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.2);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + i * 0.2 + 0.15);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start(audioCtx.currentTime + i * 0.2);
      osc.stop(audioCtx.currentTime + i * 0.2 + 0.15);
    }
  }

  function updateRealTimes() {
    const now = new Date();
    
    const nowHours = String(now.getHours()).padStart(2, '0');
    const nowMinutes = String(now.getMinutes()).padStart(2, '0');
    currentTimeDisplay.textContent = `${nowHours}:${nowMinutes}`;

    // 目標終了時刻の計算・表示
    const targetTime = endTimeStamp ? new Date(endTimeStamp) : new Date(now.getTime() + timeLeft * 1000);
    const endHours = String(targetTime.getHours()).padStart(2, '0');
    const endMinutes = String(targetTime.getMinutes()).padStart(2, '0');
    endTimeDisplay.textContent = `${endHours}:${endMinutes}`;
  }

  function updateDisplay() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    timerDisplay.textContent = 
      `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    countDisplay.textContent = `セット: ${currentSet} / ${TOTAL_SETS}`;

    const progressRatio = (totalTime - timeLeft) / totalTime;
    progressCircle.style.strokeDashoffset = progressRatio * CIRCUMFERENCE;

    updateRealTimes();
  }

  function setMode(time, statusText, color) {
    totalTime = time;
    timeLeft = time;
    endTimeStamp = null;
    statusDisplay.textContent = statusText;
    progressCircle.style.stroke = color;
    updateDisplay(); 
  }

  function toggleTimer() {
    if (timerId === null) {
      startTimer();
    } else {
      pauseTimer();
    }
  }

  function startTimer() {
    // 動作開始時の「実際の終了時刻」を記録（ミリ秒単位）
    endTimeStamp = Date.now() + timeLeft * 1000;

    timerId = setInterval(() => {
      // 終了時刻と現在時刻の差分から「本当の残り秒数」をリアルタイム計算
      const remaining = Math.round((endTimeStamp - Date.now()) / 1000);
      timeLeft = Math.max(0, remaining);

      updateDisplay();

      if (timeLeft <= 0) {
        clearInterval(timerId);
        timerId = null;
        endTimeStamp = null;
        
        playAlarmSound();

        if (isWorkTime) {
          isWorkTime = false;
          if (currentSet === TOTAL_SETS) {
            setMode(LONG_BREAK_TIME, '長い休憩 (20分)', COLORS.breakLong);
            alert('4セット完了！20分間休憩してください。');
          } else {
            setMode(SHORT_BREAK_TIME, '休憩時間 (5分)', COLORS.breakShort);
            alert('作業完了！5分間休憩してください。');
          }
        } else {
          isWorkTime = true;
          if (currentSet === TOTAL_SETS) {
            currentSet = 1;
          } else {
            currentSet++;
          }
          setMode(WORK_TIME, '作業時間 (25分)', COLORS.work);
          alert('休憩終了！次の作業を始めてください。');
        }
        
        toggleButtonState(false); 
      }
    }, 500); // 処理が間引かれてもすぐ追従するよう0.5秒間隔でチェック

    toggleButtonState(true); 
  }

  function pauseTimer() {
    clearInterval(timerId);
    timerId = null;
    endTimeStamp = null;
    toggleButtonState(false);
  }

  function resetTimer() {
    pauseTimer();
    isWorkTime = true;
    currentSet = 1;
    setMode(WORK_TIME, '作業時間 (25分)', COLORS.work);
    updateDisplay();
  }

  function toggleButtonState(isRunning) {
    if (isRunning) {
      startPauseBtn.textContent = '一時停止';
      startPauseBtn.classList.remove('start');
      startPauseBtn.classList.add('pause');
      
      currentTimeWrapper.style.display = 'none';
      endLabel.textContent = '終了時間';
    } else {
      startPauseBtn.textContent = 'スタート';
      startPauseBtn.classList.remove('pause');
      startPauseBtn.classList.add('start');
      
      currentTimeWrapper.style.display = 'inline';
      endLabel.textContent = '終了予定';
    }
  }

  // タブが再びアクティブ（画面に復帰）になった瞬間に最新の時間を即座に反映
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && timerId !== null && endTimeStamp) {
      const remaining = Math.round((endTimeStamp - Date.now()) / 1000);
      timeLeft = Math.max(0, remaining);
      updateDisplay();
    }
  });

  createFiveSegmentTicks();
  setInterval(updateRealTimes, 1000);
  updateDisplay(); 
  setMode(WORK_TIME, '作業時間 (25分)', COLORS.work);
  toggleButtonState(false);

</script>

</body>
</html>
